name: CI (cvlt-backup-summary)

# Separate pipeline for the standalone Commvault backup-summary job. Path-filtered
# so it only runs when THIS service changes — it never touches the SIP app images.
on:
  pull_request:
    paths: ["jobs/cvlt-backup-summary/**", ".github/workflows/ci-cvlt-backup.yml"]
  push:
    branches: [main]
    paths: ["jobs/cvlt-backup-summary/**", ".github/workflows/ci-cvlt-backup.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cvlt-backup-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/apythoneer/cvlt-backup-summary

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall -q jobs/cvlt-backup-summary

  build-push:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: jobs/cvlt-backup-summary
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
