name: Deploy cvlt-backup-summary (AWS EKS)

# Standalone deploy for PJ's Commvault backup-summary service. Kept SEPARATE from
# the SIP app deploy (deploy-prod.yml) but reuses the same in-cluster `eks-prod`
# runner, because a personal kubectl identity has no RBAC to write CronJobs/Services
# in storage-mgt-tools-na — only the runner's service account does.
#
# Manual-only (workflow_dispatch): activation is deliberate. By default it brings up
# the always-on health server and leaves the nightly CronJob SUSPENDED until the
# health page shows all three connections green. Flip run_etl=true to unsuspend.
#
# TEMPORARY OWNERSHIP: this is a stop-gap so the service can run now. Hand off to
# PJ/Krunal's pipeline once they have their K8s deploy structure — see
# docs/cvlt-backup-handoff.md.

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Image tag to pin (a main SHA built by ci-cvlt-backup.yml, or 'latest')"
        required: true
        default: "latest"
      run_etl:
        description: "Unsuspend the nightly ETL CronJob (false = health server only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cvlt-backup
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, eks-prod]
    environment: production
    env:
      NS: storage-mgt-tools-na
      IMG: ghcr.io/apythoneer/cvlt-backup-summary
      TAG: ${{ github.event.inputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Put kubectl (fetched by the runner initContainer) on PATH
        run: |
          echo "/tools" >> "$GITHUB_PATH"
          /tools/kubectl version --client=true

      - name: Ensure the credential Secret exists (one-time PVC seed)
        env:
          # Fresh Commvault token+refresh_token pair + pg/dd creds, as the exact
          # secrets.json the script expects. Set this repo Actions secret before the
          # first deploy. Injected here only to CREATE the k8s Secret once — the prod
          # Rancher is reachable ONLY from this in-cluster runner, so the creds can't
          # be applied from a laptop/EC2 (the nonprod EC2 cannot reach prod).
          CVLT_SECRETS_JSON: ${{ secrets.CVLT_SECRETS_JSON }}
        run: |
          if kubectl -n "$NS" get secret cvlt-backup-secrets >/dev/null 2>&1; then
            # Never overwrite: the script renews the token into the PVC; the Secret is
            # only the initial seed and may now be stale.
            echo "Secret already present — leaving it untouched."
          elif [ -n "$CVLT_SECRETS_JSON" ]; then
            umask 077
            printf '%s' "$CVLT_SECRETS_JSON" > /tmp/cvlt-secrets.json
            kubectl -n "$NS" create secret generic cvlt-backup-secrets \
              --from-file=secrets.json=/tmp/cvlt-secrets.json
            shred -u /tmp/cvlt-secrets.json 2>/dev/null || rm -f /tmp/cvlt-secrets.json
            echo "Secret created from CVLT_SECRETS_JSON (seeds the PVC on first run)."
          else
            echo "::error::cvlt-backup-secrets is missing and the Actions secret CVLT_SECRETS_JSON is not set."
            echo "Set repo Settings -> Secrets and variables -> Actions -> CVLT_SECRETS_JSON"
            echo "to a FRESH secrets.json (a stale refresh_token 401s on the first renew), then re-run."
            exit 1
          fi

      - name: Ensure private GHCR pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-apythoneer \
            --docker-server=ghcr.io \
            --docker-username=apythoneer \
            --docker-password="$GHCR_PULL_TOKEN" \
            -n "$NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests (CronJob stays suspended per the manifest)
        run: kubectl apply -k jobs/cvlt-backup-summary/k8s

      - name: Pin image on both workloads
        run: |
          kubectl -n "$NS" set image deployment/cvlt-backup-summary-health health="$IMG:$TAG"
          kubectl -n "$NS" set image cronjob/cvlt-backup-summary cvlt-backup-summary="$IMG:$TAG"

      - name: Roll out the health server
        run: kubectl -n "$NS" rollout status deployment/cvlt-backup-summary-health --timeout=120s

      - name: Optionally unsuspend the nightly ETL
        if: ${{ github.event.inputs.run_etl == 'true' }}
        run: |
          kubectl -n "$NS" patch cronjob cvlt-backup-summary -p '{"spec":{"suspend":false}}'
          echo "CronJob unsuspended."

      - name: Summary
        if: always()
        run: |
          kubectl -n "$NS" get deploy,svc,cronjob,pvc -l app=cvlt-backup-summary -o wide || true
          echo "PVC holds the rotating token; ebs-sc is WaitForFirstConsumer, so"
          echo "Pending until the first ETL pod runs is normal (not a failure):"
          kubectl -n "$NS" get pvc cvlt-backup-var || true
          echo "Validate the health header:"
          echo "  kubectl -n $NS port-forward svc/cvlt-backup-summary-health 8080:8080  # then open http://localhost:8080/"
