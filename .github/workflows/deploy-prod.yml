name: Deploy prod (AWS EKS)

# PROD on the AWS backbone (EKS cluster c-5zsl4). Promotion = advancing the `prod`
# branch to a main SHA CI already built. Runs on the IN-CLUSTER self-hosted runner
# `eks-prod` (a pod in the dev EKS cluster) — the only vantage point that reaches
# BOTH github.com and the prod Rancher; the nonprod EC2 cannot reach prod.
# kubectl targets prod via the KUBECONFIG mounted into the runner pod.
#
# The `production` environment gates this: configure a required reviewer on it
# (repo Settings -> Environments -> production) so a promotion pauses for an
# explicit Approve before it deploys.

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-prod-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, eks-prod]
    environment: production
    env:
      NS: storage-mgt-tools-na
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Put kubectl (fetched by the runner initContainer) on PATH
        run: |
          echo "/tools" >> "$GITHUB_PATH"
          /tools/kubectl version --client=true
          echo "target cluster: $(/tools/kubectl config current-context 2>/dev/null || echo '<from KUBECONFIG>')"

      - name: Ensure private GHCR pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-apythoneer \
            --docker-server=ghcr.io \
            --docker-username=apythoneer \
            --docker-password="$GHCR_PULL_TOKEN" \
            -n "$NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify the promoted SHA's images exist in ghcr
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          tok=$(printf '%s' "$GHCR_PULL_TOKEN" | base64)
          # ghcr serves a buildx OCI image index; the registry v2 manifest API only
          # returns 200 when the right media types are offered. Non-200 is a warning,
          # not a hard fail -- the rollout is the real gate if an image is missing.
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json'
          for img in usm-backend usm-frontend; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $tok" -H "Accept: $ACCEPT" \
              "https://ghcr.io/v2/apythoneer/$img/manifests/$SHA")
            echo "  $img:$SHA -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::warning::ghcr manifest check for $img:$SHA returned $code; continuing (rollout will fail if the image is genuinely missing)"
            fi
          done

      - name: Apply manifests
        run: kubectl apply -k deploy/overlays/prod

      - name: Pin images to the promoted SHA + roll out
        run: |
          kubectl -n "$NS" set image deployment/usm-backend  backend=ghcr.io/apythoneer/usm-backend:$SHA
          kubectl -n "$NS" set image deployment/usm-collector collector=ghcr.io/apythoneer/usm-backend:$SHA
          kubectl -n "$NS" set image deployment/usm-frontend  frontend=ghcr.io/apythoneer/usm-frontend:$SHA
          kubectl -n "$NS" rollout status deployment/usm-backend  --timeout=180s
          kubectl -n "$NS" rollout status deployment/usm-collector --timeout=180s
          kubectl -n "$NS" rollout status deployment/usm-frontend  --timeout=120s

      - name: Summary
        if: always()
        run: kubectl -n "$NS" get deploy,pods -l app.kubernetes.io/part-of=sip -o wide || true
