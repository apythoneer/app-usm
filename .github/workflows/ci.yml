name: CI

# Build + test on every PR; on merge to main, build and push the dev images to
# GHCR. The dev deploy (self-hosted runner on the EC2) and prod (Rancher) are
# separate workflows — this one is the build/test/publish half that runs fine on
# GitHub-hosted runners (no corp-network access required).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/apythoneer

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check (compileall)
        run: python -m compileall -q backend/app backend/scripts

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + type-check + build
        working-directory: frontend
        run: |
          npm install
          npm run build   # tsc && vite build — fails on type errors

  build-push:
    needs: [backend-check, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: usm-backend, context: backend }
          - { name: usm-frontend, context: frontend }
          - { name: usm-keepass, context: docker/keepass }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_NS }}/${{ matrix.name }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
