server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — safe to cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — all non-asset routes fall back to index.html.
    # index.html itself must never be cached, otherwise browsers keep
    # loading an old bundle (missing new routes like /capacity).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }


    # Proxy /api/ and /health to the FastAPI backend on the same host
    # network_mode: host means we reach the backend via 127.0.0.1
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # OpenAPI docs passthrough (useful during dev/testing)
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
    }
}
