server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — all non-asset routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ and /health to the FastAPI backend on the same host
    # network_mode: host means we reach the backend via 127.0.0.1
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # OpenAPI docs passthrough (useful during dev/testing)
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
    }
}
