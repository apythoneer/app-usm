apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev = the AWS Rancher nonprod namespace. Prod will be a sibling overlay
# targeting the prod cluster/namespace (built once we have prod access).
namespace: storage-mgt-tools-na-dev

resources:
  - ../../base

patches:
  # dev exposes the full API incl. Swagger: enable DEBUG + add the /docs nginx route.
  - path: patch-debug.yaml
  - path: nginx-docs.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: sip
      environment: dev
    includeSelectors: false
