# Dev-only nginx: base config + a /docs route so Swagger/OpenAPI is reachable on
# the dev host (the backend only mounts these when DEBUG=true — see patch-debug.yaml).
# Prod uses the base config (no /docs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: usm-frontend-nginx
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # index.html must never be cached (points at hashed bundles).
      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
      }

      # Swagger / OpenAPI (dev only — gated on the backend by DEBUG=true).
      location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://usm-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
      }

      # scheduler status/control lives in the collector pod (:8001).
      location /api/v1/scheduler/ {
        proxy_pass http://usm-collector:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
      }

      # everything else under /api → the backend API pods (:8000).
      location /api/ {
        proxy_pass http://usm-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
      }

      location /health {
        proxy_pass http://usm-backend:8000/health;
      }
    }
