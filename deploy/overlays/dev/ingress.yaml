# Dev public entry: nginx ingress → usm-frontend:8080.
# The frontend nginx serves the UI and proxies /api/ (and on dev, /docs) to the
# backend, so a single root rule covers UI + API + Swagger.
# Host is on the AWS nonprod SERVICES cluster wildcard (cm-svcs-nonprod-use2) —
# that is where our app actually runs; the wklds wildcard points at a different
# cluster and 404s. TLS uses the platform's "Default Ingress Controller
# Certificate": we specify the tls host only, with NO secretName — the controller
# supplies the wildcard cert automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usm-frontend
  annotations:
    # match the base nginx 120s proxy_read_timeout (ingress-nginx defaults to 60s),
    # so long analytics/scheduler requests aren't 504'd at the edge.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # ingress-nginx caps request bodies at 1 MiB by default; raise it so large
    # POSTs (chat context, bulk settings) aren't 413'd before reaching the backend.
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # TLS is terminated at the edge ELB and forwarded to the controller as HTTP;
    # without this, ingress-nginx force-redirects to https on every request (because
    # a tls host is set) and loops forever (ERR_TOO_MANY_REDIRECTS / 308).
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sip.eks-cm-svcs-nonprod-ue2.aws.corp.intranet
  rules:
    - host: sip.eks-cm-svcs-nonprod-ue2.aws.corp.intranet
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: usm-frontend
                port:
                  number: 8080
