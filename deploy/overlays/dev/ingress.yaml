# Dev public entry: nginx ingress → usm-frontend:8080.
# The frontend nginx serves the UI and proxies /api/ (and on dev, /docs) to the
# backend, so a single root rule covers UI + API + Swagger.
# Host is on the AWS nonprod workloads cluster wildcard. TLS uses the platform's
# "Default Ingress Controller Certificate": we specify the tls host only, with NO
# secretName — the controller supplies the wildcard cert automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usm-frontend
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sip.eks-cm-wklds-nonprod-ue2.aws.corp.intranet
  rules:
    - host: sip.eks-cm-wklds-nonprod-ue2.aws.corp.intranet
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: usm-frontend
                port:
                  number: 8080
