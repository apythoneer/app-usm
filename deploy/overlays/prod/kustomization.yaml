apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD = AWS EKS (the primary backbone), namespace storage-mgt-tools-na.
# Full app (backend + collector + frontend) — same shape as the dev overlay one
# tier up. Deployed by the EC2 `ec2-prod` runner via deploy-prod.yml.
#
# EKS runs the CloudWatch ADOT auto-instrumentation webhook, so the base OTel
# opt-out annotations apply (inherited from ../../base). No Azure Policy / Gatekeeper
# here — that is only the AKS azure-collector overlay. The keepass-broker is expected
# to already run in the namespace (as it does in dev).
#
# Build-once/promote: images are pinned to the promoted main SHA at deploy time.
namespace: storage-mgt-tools-na

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: sip
      environment: prod
    includeSelectors: false
