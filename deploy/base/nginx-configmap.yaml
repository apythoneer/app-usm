# k8s nginx config for the frontend. The baked-in image config proxies to
# 127.0.0.1 (host-network / docker-compose assumption); in k8s the API and
# collector are separate pods, so we proxy to their Services instead. This
# ConfigMap is mounted over /etc/nginx/conf.d/default.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: usm-frontend-nginx
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      # Renamed SIP -> ORBITS (2026-11): the old sip.<domain> host still reaches this
      # pod (it stays on the ingress) and is sent to the same path on orbits.<domain>.
      # 308, not 301, so API clients keep their method and body. TLS ends at the edge
      # ELB, so the scheme is always https. Probes use the pod IP, so they never match.
      if ($host ~* ^sip\.(.+)$) {
        return 308 https://orbits.$1$request_uri;
      }

      location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # index.html must never be cached (points at hashed bundles).
      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
      }

      # scheduler status/control lives in the collector pod (:8001).
      location /api/v1/scheduler/ {
        proxy_pass http://usm-collector:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
      }

      # Chat answers streamed as Server-Sent Events: no buffering, and the backend
      # sends a heartbeat every 10s so slow CPU answers never hit the read timeout.
      location = /api/v1/chat/stream {
        proxy_pass http://usm-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
      }

      # everything else under /api → the backend API pods (:8000).
      location /api/ {
        proxy_pass http://usm-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
      }

      location /health {
        proxy_pass http://usm-backend:8000/health;
      }
    }
