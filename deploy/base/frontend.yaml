# Frontend — nginx + built SPA. Uses the k8s nginx config (Service upstreams).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usm-frontend
  labels: { app: usm-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: usm-frontend }
  template:
    metadata:
      labels: { app: usm-frontend }
      annotations:
        # Skip ADOT auto-instrumentation (nginx doesn't need it; avoids the injected init containers).
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      imagePullSecrets:
        - name: ghcr-apythoneer
      containers:
        - name: frontend
          image: ghcr.io/apythoneer/usm-frontend
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: usm-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: usm-frontend
spec:
  selector: { app: usm-frontend }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
