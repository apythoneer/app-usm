<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backup Operations · SIP</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: sticky top bar -> filter row -> KPI tiles -> status donut + workload bars -> job table.
     Infra-ops treatment: IBM Plex Sans, blue accent, FIXED status palette for job state. */
  :root {
    color-scheme: light;
    --page:        #f4f4f2;
    --surface:     #ffffff;
    --surface-2:   #fafaf8;
    --fg:          #15150f;
    --fg-2:        #52514e;
    --muted:       #898781;
    --border:      rgba(17,17,13,0.11);
    --border-2:    rgba(17,17,13,0.06);
    --grid:        #e4e3dc;
    --accent:      #2a78d6;
    --accent-ink:  #1c5cab;
    --accent-weak: #e7f0fc;
    --st-good:     #0ca30c;
    --st-warn:     #d9960a;
    --st-serious:  #ec835a;
    --st-critical: #d03b3b;
    --st-info:     #2a78d6;
    --st-neutral:  #8a8880;
    --shadow:      0 1px 2px rgba(17,17,13,0.05), 0 1px 1px rgba(17,17,13,0.04);
    --r:           10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0c;
      --surface:     #1a1a18;
      --surface-2:   #1f1f1d;
      --fg:          #f0efec;
      --fg-2:        #c3c2b7;
      --muted:       #918f87;
      --border:      rgba(255,255,255,0.12);
      --border-2:    rgba(255,255,255,0.06);
      --grid:        #2c2c2a;
      --accent:      #3987e5;
      --accent-ink:  #8fbdf2;
      --accent-weak: #152c45;
      --st-warn:     #fab219;
      --shadow:      0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0c;
    --surface:     #1a1a18;
    --surface-2:   #1f1f1d;
    --fg:          #f0efec;
    --fg-2:        #c3c2b7;
    --muted:       #918f87;
    --border:      rgba(255,255,255,0.12);
    --border-2:    rgba(255,255,255,0.06);
    --grid:        #2c2c2a;
    --accent:      #3987e5;
    --accent-ink:  #8fbdf2;
    --accent-weak: #152c45;
    --st-warn:     #fab219;
    --shadow:      0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--page);
    color: var(--fg);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    background: var(--surface); z-index: 30;
  }
  .wrap {
    max-width: 1240px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
  .tnum { font-variant-numeric: tabular-nums; }

  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .hbar { display: flex; align-items: center; gap: 14px; padding-block: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-ink));
    display: grid; place-items: center; color: #fff;
  }
  .brand .name { font-weight: 600; font-size: 15px; letter-spacing: .2px; }
  .brand .crumb { color: var(--muted); font-size: 12px; }
  .brand .crumb b { color: var(--fg-2); font-weight: 600; }
  .spacer { flex: 1 1 40px; }
  .src {
    display: flex; align-items: center; gap: 7px; color: var(--muted);
    font-size: 11.5px; white-space: nowrap;
  }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--st-good); flex: none; }
  .dot-live.stale { background: var(--muted); }
  .dot-live.err { background: var(--st-critical); }
  @media (prefers-reduced-motion: no-preference) { .dot-live:not(.stale):not(.err) { animation: pulse 2.4s infinite; } }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(12,163,12,.45)} 70%{box-shadow:0 0 0 6px rgba(12,163,12,0)} 100%{box-shadow:0 0 0 0 rgba(12,163,12,0)} }
  .src code { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--fg-2); font-size: 11px; }
  .iconbtn {
    appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--fg-2);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; flex: none;
  }
  .iconbtn:hover { color: var(--fg); border-color: var(--muted); }

  .filters { display: flex; align-items: flex-end; gap: 16px 20px; flex-wrap: wrap; padding-block: 16px 6px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field > label { font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
  select, input[type="text"] {
    font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; min-width: 0;
  }
  select { cursor: pointer; padding-right: 26px; }
  input[type="text"] { width: 210px; max-width: 100%; }
  select:focus-visible, input:focus-visible, .chip:focus-visible, .iconbtn:focus-visible, th button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    appearance: none; cursor: pointer; font: inherit; font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--fg-2);
    padding: 6px 10px; border-radius: 999px;
  }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
  .chip[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); border-color: var(--muted); }
  .chip[aria-pressed="false"] { opacity: .5; }
  .chip:hover { border-color: var(--muted); }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding-block: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 13px 14px; box-shadow: var(--shadow); min-width: 0; }
  .tile .k { font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .tile .v { font-size: 26px; font-weight: 600; margin-top: 4px; letter-spacing: -.3px; line-height: 1.1; }
  .tile .s { font-size: 11.5px; color: var(--fg-2); margin-top: 2px; }
  .tile.alert .v { color: var(--st-critical); }
  .tile .v small { font-size: 14px; font-weight: 500; color: var(--muted); }

  .grid2 { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 12px; padding-bottom: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
  .panel > .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px 2px; }
  .panel h2 { font-size: 13.5px; }
  .panel .ph .sub { font-size: 11.5px; color: var(--muted); }
  .panel .pb { padding: 12px 16px 16px; }

  .donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .donut { position: relative; width: 168px; height: 168px; flex: none; }
  .donut svg { display: block; transform: rotate(-90deg); }
  .donut .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .donut .ctr b { font-size: 30px; font-weight: 600; letter-spacing: -.5px; }
  .donut .ctr span { font-size: 11px; color: var(--muted); display: block; margin-top: -2px; }
  .donut circle.seg { transition: stroke-width .12s ease; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .donut circle.seg { transition: none; } }
  .legend { display: flex; flex-direction: column; gap: 7px; min-width: 140px; flex: 1 1 140px; }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
  .legend .row:hover, .legend .row.hot { background: var(--surface-2); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .lb { flex: 1 1 auto; min-width: 0; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .ct { font-variant-numeric: tabular-nums; font-weight: 600; }
  .legend .pc { color: var(--muted); font-variant-numeric: tabular-nums; width: 42px; text-align: right; }

  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar { display: grid; grid-template-columns: 116px 1fr auto; align-items: center; gap: 10px; }
  .bar .wl { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 16px; background: var(--surface-2); border-radius: 4px; overflow: hidden; position: relative; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 4px; min-width: 2px; }
  .bar .meta { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--fg-2); white-space: nowrap; }
  .bar .meta .f { color: var(--st-critical); font-weight: 600; margin-left: 6px; }

  .tablecard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 26px; }
  .tabhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px; flex-wrap: wrap; }
  .tabhead h2 { font-size: 13.5px; }
  .tabhead .count { font-size: 12px; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 760px; }
  thead th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .3px; text-transform: uppercase;
    padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); position: sticky; top: 0; }
  th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  th button:hover { color: var(--fg-2); }
  th .ar { font-size: 9px; color: var(--accent); }
  tbody td { padding: 9px 14px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-2); }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .client { font-weight: 600; }
  .agent { color: var(--muted); font-size: 11px; }
  .reason { color: var(--fg-2); max-width: 260px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
    padding: 3px 9px 3px 7px; border-radius: 999px; color: var(--pc); background: color-mix(in srgb, var(--pc) 13%, transparent); }
  .pill .d { width: 6px; height: 6px; border-radius: 50%; background: var(--pc); flex: none; }
  .empty { padding: 34px 16px; text-align: center; color: var(--muted); }
  .empty.err { color: var(--st-critical); }

  #tip { position: fixed; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--fg); color: var(--page); font-size: 11.5px; line-height: 1.5; padding: 7px 9px; border-radius: 7px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); max-width: 240px; }
  #tip b { font-weight: 600; }
  #tip .tnum { font-variant-numeric: tabular-nums; }

  @media (max-width: 860px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .brand .crumb { display: none; }
    input[type="text"] { width: 100%; }
    .field.cli { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
      </span>
      <div>
        <div class="name">SIP</div>
        <div class="crumb">Storage Intelligence Platform · <b>Backup Operations</b></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="src">
      <span class="dot-live stale" id="dot" aria-hidden="true"></span>
      <span id="srcline">connecting… · <code>stormart.cvlt_backupjobsummary</code></span>
    </div>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="filters">
    <div class="field">
      <label for="f-range">Window</label>
      <select id="f-range">
        <option value="1">Last 24 hours</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </div>
    <div class="field cli">
      <label for="f-client">Client</label>
      <input type="text" id="f-client" list="clients" placeholder="All clients" autocomplete="off">
      <datalist id="clients"></datalist>
    </div>
    <div class="field" style="flex:1 1 auto">
      <label>Status</label>
      <div class="chips" id="f-status"></div>
    </div>
  </div>

  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <div class="grid2">
    <div class="panel">
      <div class="ph"><h2>Job status</h2><span class="sub" id="donut-sub"></span></div>
      <div class="pb donut-wrap">
        <div class="donut">
          <svg width="168" height="168" viewBox="0 0 168 168" id="donut" role="img" aria-label="Job status breakdown"></svg>
          <div class="ctr"><b class="tnum" id="donut-total">—</b><span>jobs</span></div>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="panel">
      <div class="ph"><h2>Jobs by workload</h2><span class="sub">bar = jobs · <span style="color:var(--st-critical)">red</span> = failed</span></div>
      <div class="pb"><div class="bars" id="bars"></div></div>
    </div>
  </div>

  <div class="tablecard">
    <div class="tabhead">
      <h2>Backup jobs</h2>
      <span class="count" id="tab-count"></span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="tip" role="status"></div>

<script>
"use strict";
(function () {
  var root = document.documentElement;
  try { var sv = localStorage.getItem("bo-theme"); if (sv) root.setAttribute("data-theme", sv); } catch (e) {}
  document.getElementById("theme").addEventListener("click", function () {
    var dark = getComputedStyle(root).getPropertyValue("color-scheme").indexOf("dark") > -1;
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("bo-theme", next); } catch (e) {}
  });

  var STATUS = {
    "Completed":             { hex:"#0ca30c" },
    "Completed with errors": { hex:"#d9960a" },
    "Partial Success":       { hex:"#ec835a" },
    "Failed":                { hex:"#d03b3b" },
    "Running":               { hex:"#2a78d6" },
    "Committed":             { hex:"#8a8880" }
  };
  var STATUS_ORDER = ["Completed","Completed with errors","Partial Success","Failed","Running","Committed"];

  var state = { days: 1, client: "", status: {} };
  STATUS_ORDER.forEach(function(s){ state.status[s] = true; });

  var chipWrap = document.getElementById("f-status");
  STATUS_ORDER.forEach(function(s){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed","true");
    b.style.setProperty("--c", STATUS[s].hex);
    b.innerHTML = '<span class="sw"></span>' + s;
    b.addEventListener("click", function(){
      state.status[s] = !state.status[s];
      b.setAttribute("aria-pressed", state.status[s] ? "true" : "false");
      load();
    });
    chipWrap.appendChild(b);
  });
  document.getElementById("f-range").addEventListener("change", function(e){ state.days = +e.target.value; load(); });
  var cliTimer;
  document.getElementById("f-client").addEventListener("input", function(e){
    state.client = e.target.value.trim();
    clearTimeout(cliTimer); cliTimer = setTimeout(load, 300);
  });

  function fmtInt(n){ return (n == null ? 0 : n).toLocaleString("en-US"); }
  function fmtData(gb){
    gb = gb || 0;
    if (gb >= 1024*1024) return (gb/1048576).toFixed(2) + " PB";
    if (gb >= 1024) return (gb/1024).toFixed(1) + " TB";
    return (gb < 10 ? gb.toFixed(1) : Math.round(gb).toString()) + " GB";
  }
  function fmtDur(m){ if (m == null) return "—"; m = Math.round(m); if (m >= 60) { return Math.floor(m/60) + "h " + (m%60) + "m"; } return m + "m"; }
  function fmtTime(iso){
    if (!iso) return "—";
    var d = new Date(iso); if (isNaN(d)) return iso;
    var now = new Date();
    var t = d.toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit"});
    if (d.toDateString() === now.toDateString()) return "Today " + t;
    var yd = new Date(Date.now() - 86400000);
    if (d.toDateString() === yd.toDateString()) return "Yest " + t;
    return d.toLocaleDateString("en-US", {month:"short", day:"numeric"}) + " " + t;
  }
  function ago(iso){
    if (!iso) return "just now";
    var s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s/60) + "m ago";
    return Math.floor(s/3600) + "h ago";
  }

  var sort = { key: "start_time", dir: -1 };
  var COLS = [
    {k:"client_name", t:"Client"}, {k:"workload", t:"Workload"}, {k:"start_time", t:"Start"},
    {k:"duration_mins", t:"Duration", num:true}, {k:"size_of_application_gb", t:"Data", num:true},
    {k:"job_status", t:"Status"}, {k:"failure_reason", t:"Failure reason"}
  ];

  var tip = document.getElementById("tip");
  function showTip(html, x, y){ tip.innerHTML = html; tip.style.opacity = 1; moveTip(x,y); }
  function moveTip(x,y){ var w = tip.offsetWidth; tip.style.left = Math.min(x+14, innerWidth-w-8)+"px"; tip.style.top = (y+16)+"px"; }
  function hideTip(){ tip.style.opacity = 0; }

  function setSrc(kind, text){
    var dot = document.getElementById("dot");
    dot.className = "dot-live" + (kind === "ok" ? "" : kind === "err" ? " err" : " stale");
    document.getElementById("srcline").innerHTML = text + ' · <code>stormart.cvlt_backupjobsummary</code>';
  }

  var curRows = [];

  function load(){
    var statuses = STATUS_ORDER.filter(function(s){ return state.status[s]; });
    var allOn = statuses.length === STATUS_ORDER.length;
    var p = new URLSearchParams();
    p.set("window", String(state.days));
    if (state.client) p.set("client", state.client);
    if (!allOn) p.set("status", statuses.join(","));
    document.getElementById("tab-count").textContent = "loading…";
    setSrc("stale", "refreshing…");
    fetch("/api/jobs?" + p.toString(), { headers: { "Accept": "application/json" } })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function(res){
        if (!res.ok || (res.j && res.j.error)) throw new Error((res.j && res.j.error) || ("HTTP " + res.status));
        renderAll(res.j);
      })
      .catch(function(err){ renderError(err.message); });
  }

  function renderError(msg){
    setSrc("err", "query failed");
    document.getElementById("kpis").innerHTML = "";
    document.getElementById("donut").innerHTML = "";
    document.getElementById("donut-total").textContent = "—";
    document.getElementById("legend").innerHTML = "";
    document.getElementById("bars").innerHTML = "";
    document.getElementById("tab-count").textContent = "";
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="7" class="empty err">Could not load live data: ' + String(msg).replace(/</g,"&lt;") + '</td></tr>';
  }

  function renderAll(d){
    setSrc("ok", "updated " + ago(d.generated_at));
    var total = d.total || 0;
    var bs = d.by_status || {};
    var done = bs["Completed"] || 0;
    var failed = bs["Failed"] || 0;
    var errs = (bs["Completed with errors"] || 0) + (bs["Partial Success"] || 0);
    var succ = total ? (done/total*100) : 0;

    var kpis = [
      {k:"Total jobs", v:fmtInt(total), s:"in window"},
      {k:"Success rate", v:succ.toFixed(1)+'<small>%</small>', s:fmtInt(done)+" completed clean"},
      {k:"Failed", v:fmtInt(failed), s:(total?(failed/total*100).toFixed(1):0)+"% of runs", alert: failed>0},
      {k:"With warnings", v:fmtInt(errs), s:"errors / partial"},
      {k:"Data protected", v:fmtData(d.data_gb), s:"sum of application size"},
      {k:"Clients", v:fmtInt(d.clients), s:"distinct, covered"}
    ];
    document.getElementById("kpis").innerHTML = kpis.map(function(t){
      return '<div class="tile'+(t.alert?' alert':'')+'"><div class="k">'+t.k+'</div><div class="v tnum">'+t.v+'</div><div class="s">'+t.s+'</div></div>';
    }).join("");

    // donut
    var present = STATUS_ORDER.filter(function(s){ return (bs[s] || 0) > 0; });
    var svg = document.getElementById("donut"), C = 2*Math.PI*66, cum = 0;
    svg.innerHTML = '<circle cx="84" cy="84" r="66" fill="none" stroke="var(--grid)" stroke-width="18"/>';
    present.forEach(function(s){
      var f = bs[s]/total;
      var seg = document.createElementNS("http://www.w3.org/2000/svg","circle");
      seg.setAttribute("class","seg"); seg.setAttribute("cx",84); seg.setAttribute("cy",84); seg.setAttribute("r",66);
      seg.setAttribute("fill","none"); seg.setAttribute("stroke",STATUS[s].hex); seg.setAttribute("stroke-width",18);
      seg.setAttribute("stroke-dasharray", Math.max(0,f*C-2).toFixed(2)+" "+C.toFixed(2));
      seg.setAttribute("stroke-dashoffset", (-cum*C).toFixed(2));
      var pc = f*100;
      seg.addEventListener("pointerenter", function(e){ seg.setAttribute("stroke-width",22); hot(s,true);
        showTip('<b>'+s+'</b><br><span class="tnum">'+fmtInt(bs[s])+'</span> jobs · <span class="tnum">'+pc.toFixed(1)+'%</span>', e.clientX, e.clientY); });
      seg.addEventListener("pointermove", function(e){ moveTip(e.clientX,e.clientY); });
      seg.addEventListener("pointerleave", function(){ seg.setAttribute("stroke-width",18); hot(s,false); hideTip(); });
      svg.appendChild(seg);
      cum += f;
    });
    document.getElementById("donut-total").textContent = fmtInt(total);
    document.getElementById("donut-sub").textContent = total ? succ.toFixed(1) + "% clean" : "";
    document.getElementById("legend").innerHTML = present.map(function(s){
      return '<div class="row" data-s="'+s+'"><span class="sw" style="background:'+STATUS[s].hex+'"></span>'+
        '<span class="lb">'+s+'</span><span class="ct tnum">'+fmtInt(bs[s])+'</span>'+
        '<span class="pc tnum">'+(bs[s]/total*100).toFixed(1)+'%</span></div>';
    }).join("") || '<div class="pc" style="color:var(--muted)">no jobs</div>';
    function hot(s, on){ var r = document.querySelector('.legend .row[data-s="'+CSS.escape(s)+'"]'); if (r) r.classList.toggle("hot", on); }

    // workload bars
    var wl = d.by_workload || [];
    var wlMax = wl.reduce(function(m,x){ return Math.max(m, x.n); }, 1);
    document.getElementById("bars").innerHTML = wl.map(function(x){
      var pct = x.n/wlMax*100;
      return '<div class="bar"><span class="wl" title="'+(x.workload||"—")+'">'+(x.workload||"—")+'</span>'+
        '<div class="track"><div class="fill" style="width:'+pct.toFixed(1)+'%"></div></div>'+
        '<span class="meta tnum">'+fmtInt(x.n)+(x.failed?'<span class="f">'+x.failed+' failed</span>':'')+'</span></div>';
    }).join("") || '<div class="pc" style="color:var(--muted)">no jobs in window</div>';

    curRows = d.rows || [];
    renderTable(total);
  }

  function renderTable(total){
    document.getElementById("thead").innerHTML = COLS.map(function(c){
      var ar = sort.key === c.k ? '<span class="ar">'+(sort.dir<0?"▼":"▲")+'</span>' : '';
      return '<th'+(c.num?' style="text-align:right"':'')+'><button data-k="'+c.k+'">'+c.t+ar+'</button></th>';
    }).join("");
    document.querySelectorAll("#thead button").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.k;
        if (sort.key === k) sort.dir *= -1;
        else { sort.key = k; sort.dir = (k==="start_time"||k==="duration_mins"||k==="size_of_application_gb") ? -1 : 1; }
        renderTable(total);
      });
    });

    var rows = curRows.slice().sort(function(a,b){
      var k = sort.key, va = a[k], vb = b[k];
      if (k === "start_time") { return ((new Date(va)) - (new Date(vb))) * sort.dir; }
      if (k === "duration_mins" || k === "size_of_application_gb") { return ((va||0)-(vb||0)) * sort.dir; }
      return String(va||"").localeCompare(String(vb||"")) * sort.dir;
    });

    document.getElementById("tab-count").textContent = total ? ("showing " + rows.length + " of " + fmtInt(total)) : "";
    var tb = document.getElementById("tbody");
    if (!rows.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">No jobs match these filters.</td></tr>'; return; }
    tb.innerHTML = rows.map(function(j){
      var st = STATUS[j.job_status] || { hex: "#8a8880" };
      var running = j.job_status === "Running" || !j.end_time;
      return '<tr>'+
        '<td><div class="client">'+(j.client_name||"—")+'</div><div class="agent">'+(j.agent||"")+(j.subclient?' · '+j.subclient:'')+'</div></td>'+
        '<td>'+(j.workload||"—")+'</td>'+
        '<td class="num">'+fmtTime(j.start_time)+'</td>'+
        '<td class="num" style="text-align:right">'+(running ? '<span style="color:var(--st-info)">running</span>' : fmtDur(j.duration_mins))+'</td>'+
        '<td class="num" style="text-align:right">'+fmtData(j.size_of_application_gb)+'</td>'+
        '<td><span class="pill" style="--pc:'+st.hex+'"><span class="d"></span>'+(j.job_status||"—")+'</span></td>'+
        '<td class="reason">'+(j.failure_reason ? String(j.failure_reason).replace(/</g,"&lt;") : '<span style="color:var(--muted)">—</span>')+'</td>'+
      '</tr>';
    }).join("");

    // refresh client datalist from what came back
    var seen = {}, names = [];
    curRows.forEach(function(j){ if (j.client_name && !seen[j.client_name]) { seen[j.client_name]=1; names.push(j.client_name); } });
    document.getElementById("clients").innerHTML = names.sort().map(function(n){ return '<option value="'+n+'">'; }).join("");
  }

  load();
})();
</script>
</body>
</html>
