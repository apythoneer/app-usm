# Backup Operations showcase — one read-only web pod (serves the page + /api/jobs
# over stormart). Runs in the PROD namespace next to cvlt-backup-summary so it
# reuses that pipeline's Postgres creds (mounted read-only) and proven network path.
# Deliberately separate from the SIP app and from the cvlt-backup CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-ops-mockup
  labels:
    app: backup-ops-mockup
    app.kubernetes.io/part-of: backup-ops-mockup
spec:
  replicas: 1
  selector:
    matchLabels: { app: backup-ops-mockup }
  template:
    metadata:
      labels: { app: backup-ops-mockup }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      imagePullSecrets:
        - name: ghcr-apythoneer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup-ops-mockup
          # Pinned to an immutable SHA tag at deploy time; :latest is the staged placeholder.
          image: ghcr.io/apythoneer/backup-ops-mockup:latest
          ports:
            - containerPort: 8080
          env:
            - name: SECRETS_PATH
              value: /var/secrets/secrets.json
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 8
            periodSeconds: 30
          # Required by the namespace ResourceQuota (requests+limits for cpu AND memory).
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Postgres creds only — read-only. Reuses the pipeline's Secret so no new
            # credential is introduced; the app reads just the "postgres" block.
            - name: secrets
              mountPath: /var/secrets
              readOnly: true
            # readOnlyRootFilesystem: give the process a scratch /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: cvlt-backup-secrets
            items:
              - key: secrets.json
                path: secrets.json
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backup-ops-mockup
  labels:
    app: backup-ops-mockup
spec:
  selector: { app: backup-ops-mockup }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
