# Single static page on 8080. No upstreams (unlike the SIP frontend), so nothing
# to resolve at startup — it stands alone. /healthz gives the probes a cheap 200.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
