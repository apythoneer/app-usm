# TEMPLATE ONLY — do not commit real values, do not `kubectl apply` this file.
# The CronJob mounts this Secret at /home/cvadmin/.var/secrets.json. The single
# `secrets.json` key holds the exact JSON the script's load_secrets() expects.
#
# Create it out-of-band (never in git), e.g. from a local file:
#
#   cat > /tmp/secrets.json <<'JSON'
#   {
#     "commvault": { "token": "<RENEWABLE-AUTHTOKEN>" },
#     "postgres":  {
#       "host": "<stormart-postgres-host>",
#       "port": 5432,
#       "database": "stormart",
#       "user": "<user>",
#       "password": "<password>"
#     },
#     "datadog":   { "api_key": "<DD-API-KEY>" }
#   }
#   JSON
#
#   kubectl -n storage-mgt-tools-na create secret generic cvlt-backup-secrets \
#       --from-file=secrets.json=/tmp/secrets.json
#   shred -u /tmp/secrets.json   # don't leave creds on disk
#
# The manifest form below is shown only for reference (stringData, not committed):
apiVersion: v1
kind: Secret
metadata:
  name: cvlt-backup-secrets
  namespace: storage-mgt-tools-na
type: Opaque
# CONFIRMED infra (from the sibling storage-ops jobs that run successfully daily):
#   postgres host = aws-pgsql-storage-mgt-tools-na-p-use2-01.czckywwqu124.us-east-2.rds.amazonaws.com
#                   (AWS RDS, us-east-2, private IP 10.168.203.75 in the prod VPC — NOT on-prem)
#   postgres db   = stormart01p   (schema: stormart)
# The PROVEN credentials are KeePass-brokered service accounts, not a static token:
#   Commvault -> KeePass entry "CommVault_scriptuser"   Postgres -> "postgres_db_creds"
# Prefer wiring the job to the in-cluster KeePass broker (http://keepass-broker:2000) like the
# sibling jobs; the static values below are a fallback if a broker integration is out of scope.
stringData:
  secrets.json: |
    {
      "commvault": { "token": "REPLACE_ME (prefer CommVault_scriptuser from KeePass)" },
      "postgres":  { "host": "aws-pgsql-storage-mgt-tools-na-p-use2-01.czckywwqu124.us-east-2.rds.amazonaws.com", "port": 5432, "database": "stormart01p", "user": "REPLACE_ME", "password": "REPLACE_ME" },
      "datadog":   { "api_key": "REPLACE_ME" }
    }
