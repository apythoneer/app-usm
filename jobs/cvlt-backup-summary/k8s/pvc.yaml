# Writable, persistent home for /home/cvadmin/.var/secrets.json.
#
# WHY A PVC (not the Secret mount): the script rewrites secrets.json on every
# Commvault token renewal (401 -> /AccessToken/Renew -> new token+refresh saved
# back) and writes a .bak on every import. A Secret mount is read-only. And
# because the refresh_token ROTATES on each renew, the updated pair must survive
# pod restarts — an emptyDir would lose it and the next cold start would renew
# with a dead token. The CronJob seeds this volume ONCE from the Secret (only if
# the file is absent) and owns it thereafter, mirroring exactly how the script
# maintains the file on the host today.
#
# WHY EFS, NOT EBS: ebs-sc on this cluster (c-5zsl4) is WaitForFirstConsumer and
# never bound — the ETL pod stayed Pending until activeDeadlineSeconds killed it
# (DeadlineExceeded), every run. efs-prometheus-sc is efs.csi.aws.com with
# provisioningMode=efs-ap + volumeBindingMode=Immediate (fileSystemId
# fs-09d715d65f1ecb44a), proven in use by Prometheus/Kubecost: it binds in
# seconds and gives this PVC its OWN isolated EFS access point. RWX because EFS
# is shared (functionally RWO here — only the CronJob mounts it, Forbid
# concurrency). NB: that class is reclaimPolicy=Retain, so deleting this PVC
# leaves the access point behind (manual cleanup).
#
# HANDOFF TODO: efs-prometheus-sc is borrowed (owned by monitoring). When someone
# with cluster RBAC is available, cut over to a dedicated StorageClass
# (cvlt-backup-efs, same efs-ap params) so the ownership reads cleanly.
#
# Only the CronJob mounts this (reused across daily runs via Forbid concurrency).
# The health Deployment does NOT mount it — it reads the read-only Secret instead
# (it never renews the token).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cvlt-backup-var
  namespace: storage-mgt-tools-na
  labels:
    app: cvlt-backup-summary
    app.kubernetes.io/part-of: cvlt-backup
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # EFS ignores capacity (elastic), but the field is required.
      storage: 128Mi
  storageClassName: efs-prometheus-sc
