# Commvault backup-job summary pipeline, as a nightly Kubernetes CronJob.
#
# STAGED, NOT ACTIVE. Three things gate going live (see README.md):
#   1. suspend: true  -> set to false once the token/refresh pair is seeded and
#      the three egress legs are confirmed.
#   2. The Secret `cvlt-backup-secrets` must exist in the namespace (NOT committed;
#      created out-of-band from secret.example.yaml, from a FRESH token+refresh).
#   3. The PVC `cvlt-backup-var` must be bound (pvc.yaml).
#
# Credential flow: the init container seeds secrets.json from the Secret into the
# PVC ONCE (only if absent), then the main container runs the script, which owns
# the file from then on (renews + rewrites the token/refresh pair in place). The
# PVC persists the rotating pair across runs; the Secret is only the initial seed.
#
# Separate from the SIP app: own namespace-scoped CronJob, own image, own Secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cvlt-backup-summary
  namespace: storage-mgt-tools-na
  labels:
    app: cvlt-backup-summary
    app.kubernetes.io/part-of: cvlt-backup
spec:
  # Report pulls the last 24h ("-PT24H P0D"); run once daily after the backup
  # window. 13:00 UTC ~= early morning US. Adjust to the real backup SLA.
  schedule: "0 13 * * *"
  timeZone: "Etc/UTC"
  suspend: true                 # <-- FLIP to false to go live
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1           # fail loud; a daily job re-runs tomorrow
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: cvlt-backup-summary
          annotations:
            # Opt out of EKS ADOT auto-instrumentation (same as the SIP pods).
            instrumentation.opentelemetry.io/inject-python: "false"
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-apythoneer
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000          # makes the PVC group-writable by uid 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Seed secrets.json into the PVC ONCE. `cp` only if absent, so a token
            # the script has since renewed in the PVC is never clobbered by the
            # (now-stale) Secret. The Secret is the bootstrap; the PVC is truth.
            - name: seed-secrets
              image: ghcr.io/apythoneer/cvlt-backup-summary:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  if [ -f /pvc/secrets.json ]; then
                    echo "secrets.json already present in PVC — keeping renewed tokens"
                  else
                    cp /seed/secrets.json /pvc/secrets.json
                    echo "seeded secrets.json into PVC from Secret"
                  fi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: seed
                  mountPath: /seed
                  readOnly: true
                - name: secrets
                  mountPath: /pvc
          containers:
            - name: cvlt-backup-summary
              # Pinned to an immutable SHA tag at deploy time (see README). :latest
              # here is a placeholder for the staged state.
              image: ghcr.io/apythoneer/cvlt-backup-summary:latest
              imagePullPolicy: IfNotPresent
              # run_job.py wraps PJ's main() to record each run in cvlt_job_runs
              # (feeds the health server's last-run panel); exit code is unchanged.
              command: ["python", "-u", "run_job.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: "100m", memory: "128Mi" }
                limits: { cpu: "500m", memory: "512Mi" }
              volumeMounts:
                # The script reads AND rewrites /home/cvadmin/.var/secrets.json
                # (token renewal + .bak), so this mount must be WRITABLE — the PVC,
                # not the Secret. No code change needed.
                - name: secrets
                  mountPath: /home/cvadmin/.var
          volumes:
            # Writable, persistent store the script owns (seeded once by initContainer).
            - name: secrets
              persistentVolumeClaim:
                claimName: cvlt-backup-var
            # Read-only initial seed (token/refresh pair + pg/dd creds).
            - name: seed
              secret:
                secretName: cvlt-backup-secrets
                items:
                  - key: secrets.json
                    path: secrets.json
                defaultMode: 0400
