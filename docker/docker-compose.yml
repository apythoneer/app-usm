version: '3.8'

# USM v3 — Storage Intelligence Platform
#
# Uses network_mode: host so containers share the host network stack.
# Required to reach internal DNS (*.ctl.intranet, *.corp.intranet).
#
# Run:   docker compose -f docker/docker-compose.yml up -d --build
# Logs:  docker compose -f docker/docker-compose.yml logs -f
# Stop:  docker compose -f docker/docker-compose.yml down
#
# Ports (on host):
#   8000 — FastAPI backend  (API + auto-docs at http://host:8000/docs)
#   8080 — React frontend   (dashboard at http://host:8080)
#
# v1 (5050/5051) and v2 (8000/8080) can run side-by-side during migration.

services:

  # ============================================================
  # BACKEND — FastAPI + APScheduler (collectors run inside here)
  # ============================================================
  usm-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: usm-backend
    hostname: usm-backend
    network_mode: host
    environment:
      - TZ=America/Denver
      # Pin the hash seed so Python's hash() is stable across restarts. Several
      # alert collectors derive message_id from hash(native_id); without this,
      # every container restart re-keys open alerts and re-fires them (alert
      # storm on each deploy). Stopgap until stable content-hash ids land.
      - PYTHONHASHSEED=0
      # SQL Server
      - SQL_SERVER=usidcvsql0252.ctl.intranet
      - SQL_DATABASE=StorMart
      - DB_SCHEMA=USM
      - SQL_DRIVER=ODBC Driver 17 for SQL Server
      # KeePass
      - KEEPASS_URL=http://usodclpsandadm1.corp.intranet:2000/keepass
      - SQL_CRED_KEY=SQLServerDB
      - PURE_CRED_KEY=PureStorage
      # JWT auth (not enforced yet — set a real value before Phase 3)
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_BEFORE_PRODUCTION}
      # Notifications (set TEAMS_WEBHOOK_URL in .env to enable)
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      # Datadog Event Management — the alert paging path. API key is resolved from
      # KeePass (entry named by DATADOG_CRED_KEY); enable via .env.
      - DATADOG_ENABLED=${DATADOG_ENABLED:-false}
      - DATADOG_CRED_KEY=${DATADOG_CRED_KEY:-Datadog}
      - DATADOG_API_KEY=${DATADOG_API_KEY:-}
      - DATADOG_SEVERITIES=${DATADOG_SEVERITIES:-critical,warning}
      - DATADOG_EVENTS_URL=${DATADOG_EVENTS_URL:-https://event-management-intake.us5.datadoghq.com/api/v2/events}
      - SNOW_ENABLED=false
      - SNOW_SEVERITIES=critical
      - SNOW_CATEGORY=Alert > Infrastructure
      - SNOW_CI=Pure Storage CBS
      - SNOW_LOCATION=Denver
      - SNOW_GROUP=${SNOW_GROUP:-}
      # CORS — frontend on port 8080
      - CORS_ORIGINS=["http://localhost:8080","http://usodclpsandadm1.corp.intranet:8080"]
      # Collector intervals (seconds) — tuned for 84 arrays across 7 vendors
      - METRICS_INTERVAL=300
      - VOLUMES_INTERVAL=1800
      - ALERTS_INTERVAL=600
      # Chat / Ollama (local LLM — no data leaves)
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - CHAT_ENABLED=true
      # Second chat backend: DGX Spark (benchmark/POC), reached through
      # Cloudflare Access. Empty by default so it is opt-in, never accidental.
      # NOTE: this backend is OFF-NETWORK. The local backend above sends nothing
      # outside the host; anything routed to the DGX sends question text (and,
      # for the answer-formatting step, SQL result rows) to an external endpoint.
      # The benchmark harness deliberately uses SQL-generation only, which sends
      # schema + question and no row data.
      - CHAT_DGX_BASE_URL=${CHAT_DGX_BASE_URL:-}
      - CHAT_DGX_MODEL=${CHAT_DGX_MODEL:-qwen3:30b-a3b}
      # Cloudflare Access service token. Values live in .env (never in this file
      # or in git). Without them the DGX endpoint 302s to an IdP login page and
      # every call returns HTML instead of JSON.
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      # Paths
      - LOG_DIR=/app/logs
      - ARRAYS_CONFIG_FILE=/app/config/arrays.txt
      # SQLite cache
      - USM_CACHE_DB=/app/data/usm_cache.db
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config:ro
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================
  # FRONTEND — React SPA via Nginx on port 8080
  # ============================================================
  usm-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: usm-frontend
    hostname: usm-frontend
    network_mode: host
    environment:
      - TZ=America/Denver
    restart: unless-stopped
    depends_on:
      - usm-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # KEEPASS — Credential REST API (gunicorn, 4 workers, cached)
  # ============================================================
  usm-keepass:
    build:
      context: keepass
      dockerfile: Dockerfile
    container_name: usm-keepass
    hostname: usm-keepass
    network_mode: host
    environment:
      - KEEPASS_DB=/data/keepass/StorageOps-Database.kdbx
      # Required — no default. Must be set in .env (see .env.example).
      - KEEPASS_PASSWORD=${KEEPASS_PASSWORD:?KEEPASS_PASSWORD must be set in .env — the vault master password has no fallback}
      - CACHE_TTL=60
    volumes:
      - /opt/sanadmin/data/nasshare:/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:2000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # OLLAMA — Local LLM for chat/Text-to-SQL (no data leaves)
  # ============================================================
  usm-ollama:
    image: ollama/ollama:latest
    container_name: usm-ollama
    hostname: usm-ollama
    network_mode: host
    environment:
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama-data:
